<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="waveGradFull" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9A3C" />
      <stop offset="35%" stop-color="#FF5CF0" />
      <stop offset="70%" stop-color="#8A57FF" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <radialGradient id="chromeSphereFull" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>

    <radialGradient id="sphereHighlightFull" cx="32%" cy="28%" r="35%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="rimLightFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5CF0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#8A57FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FF9A3C" stop-opacity="0.9" />
    </linearGradient>

    <filter id="sphereShadowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Logo Symbol (Scaled and Positioned at left) -->
  <g transform="translate(10, 5) scale(0.7)">
    <g stroke="url(#waveGradFull)" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.95">
      <path d="M 68 18 C 45 12, 18 28, 18 56 C 18 80, 40 92, 65 88 C 84 84, 90 65, 84 48 C 78 35, 62 34, 50 42 C 40 50, 38 65, 48 74 C 56 81, 70 78, 74 68" />
      <path d="M 64 24 C 46 19, 25 32, 25 55 C 25 74, 43 84, 62 81 C 77 78, 83 63, 78 50 C 73 40, 60 39, 52 46 C 45 52, 44 63, 51 69" opacity="0.8" stroke-width="2" />
      <path d="M 60 30 C 47 26, 32 36, 32 54 C 32 68, 46 76, 59 74 C 70 72, 75 60, 71 50 C 68 43, 58 43, 53 48" opacity="0.6" stroke-width="1.6" />
      <path d="M 68 12 C 38 7, 12 25, 12 56 C 12 85, 38 96, 68 93 C 90 89, 96 68, 90 46" opacity="0.35" stroke-width="1.2" />
    </g>

    <g filter="url(#sphereShadowFull)">
      <circle cx="58" cy="56" r="14" fill="url(#chromeSphereFull)" />
      <circle cx="58" cy="56" r="13.5" fill="none" stroke="url(#rimLightFull)" stroke-width="1.2" opacity="0.75" />
      <ellipse cx="53" cy="50" rx="6" ry="4" fill="url(#sphereHighlightFull)" transform="rotate(-25 53 50)" />
      <circle cx="52" cy="48" r="2" fill="#FFFFFF" opacity="0.95" />
    </g>
  </g>

  <!-- Typography -->
  <g class="logo-text">
    <text x="85" y="44" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.03em" fill="currentColor">CoDecision</text>
    <text x="86" y="60" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.25em" fill="#8A57FF" opacity="0.9">SOFTWARE HOUSE</text>
  </g>
</svg>
